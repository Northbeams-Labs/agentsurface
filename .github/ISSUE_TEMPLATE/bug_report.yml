name: Bug report
description: agentsurface did something wrong, crashed, or reported something incorrectly.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Use the private channel in
        [SECURITY.md](https://github.com/Northbeams-Labs/agentsurface/blob/main/SECURITY.md).

        If the problem is that we failed to find something that is installed on
        your machine, use the "Missed detection" template instead.

        Please redact secrets, tokens and API keys from anything you paste. We
        do not need them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in your own words.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >-
        The exact command, and what state the machine was in. If it depends on a
        particular file, describe the file rather than pasting a private one.
      placeholder: |
        1. agentsurface --json
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        Paste the relevant output, redacted. It is rendered as a code block, so
        no backticks are needed.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `agentsurface --version`.
      placeholder: agentsurface v0.1.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How it was installed
      options:
        - Homebrew tap
        - go install
        - Release binary from GitHub
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.6 arm64, Ubuntu 24.04 amd64, Windows 11 24H2
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets, tokens and personal paths I do not want public.
          required: true
        - label: This is not a security vulnerability. I have read SECURITY.md.
          required: true
        - label: I searched existing issues.
          required: false
