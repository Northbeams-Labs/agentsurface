version: 2

updates:
  # Go modules. The module depends on the standard library only today, so this
  # is mostly a tripwire: if a direct dependency ever appears, updates to it
  # arrive as pull requests rather than being forgotten.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - go

  # GitHub Actions. Every action is pinned to a full commit SHA, so this is the
  # only thing that moves those pins. Keep the version comment on each `uses:`
  # line accurate when merging one of these.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
